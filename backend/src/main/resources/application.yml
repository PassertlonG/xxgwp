server:
  port: 8080

spring:
  devtools:
    restart:
      enabled: false
  application:
    name: xxgwy-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/xxgwy
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: change-me-in-production-change-me-in-production!!
    expiration-hours: 24

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
