server:
  port: 3000

spring:
  application:
    name: xxgwy-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/xxgwy
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: change-me-in-production
    expiration-hours: 24

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
